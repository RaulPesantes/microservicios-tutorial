# spring.application.name=moto-service
# server.port=8083

spring:
    application:
        name: moto-service
    cloud:
        config:
            enabled: true
            uri: http://localhost:8081

# Ese http://localhost:8081 del bootstrap.yaml
# NO es un puerto que se "define" para moto-service. Es una DIRECCIÓN a la que se "apunta".
# El puerto http://localhost:8081 se DEFINIO EN: config-service/src/main/resources/application.yaml
# en la propiedad `server.port: 8081`.
# El puerto real de moto-service es el 8103, y se DEFINE en GitHub, en:
# config-data/moto-service.yaml → server.port: 8103